<!DOCTYPE html>
<html lang="mn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Өдрийн хөтөлбөр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Noto+Sans:wght@400;500;600&family=Noto+Serif:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--panel:#131312;--line:#26241f;--ink:#ECE8DD;--mute:#9A9588;--gold:#C9A84C;--gold-ink:#0A0A0A;--bubble:#1c1b18;
--serif:"DM Serif Display","Noto Serif",Georgia,serif;--sans:Outfit,"Noto Sans",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
[data-theme=light]{--bg:#F6F3EC;--panel:#FFFFFF;--line:#E2DDD0;--ink:#1B1A17;--mute:#6C675B;--gold:#8A6D1C;--gold-ink:#FFFFFF;--bubble:#EEE9DB}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:14px;color:var(--mute)}
.top b{color:var(--ink);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-bottom:44px}
.strip a{height:6px;background:var(--line);border-radius:2px}
.strip a.done{background:color-mix(in srgb,var(--gold) 45%,var(--line))}
.strip a.now{background:var(--gold)}
h1{font:400 clamp(34px,7vw,52px)/1.15 var(--serif);margin:0 0 6px}
.sub{font-family:var(--mono);font-size:13px;color:var(--mute);margin:0 0 22px}
.ctx{font-size:18px;max-width:60ch;margin:0 0 36px}
h2{font:400 26px/1.25 var(--serif);margin:0 0 4px}
section{padding:36px 0;border-top:1px solid var(--line)}
.lead{color:var(--mute);margin:0 0 18px;font-size:15px}
.steps{list-style:none;margin:0 0 44px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.steps li{display:flex;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps input{accent-color:var(--gold);width:18px;height:18px;flex:none}
.steps a{text-decoration:none;flex:1}
.steps span{font-family:var(--mono);font-size:13px;color:var(--mute)}
.steps li.ok a{color:var(--mute);text-decoration:line-through}
.video{aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);font-size:14px;overflow:hidden}
.video iframe{width:100%;height:100%;border:0}
details{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
summary{cursor:pointer;padding:12px 16px;color:var(--mute);font-size:15px}
details .in{padding:0 16px 14px;font-size:15px}
.cards{display:grid;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px}
.ex .en{font:500 19px/1.35 var(--sans);margin:0}
.ex .mn{margin:4px 0 0;font-size:16px}
.ex .use{margin:2px 0 0;color:var(--mute);font-size:14px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.pair{display:grid;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.pair:first-of-type{border-top:0}
.pair h3{margin:0;font:500 16px var(--sans)}
.row{display:grid;grid-template-columns:1fr;gap:2px;font-size:15px}
.row q{font-family:var(--mono);font-size:14px;quotes:none;color:var(--gold)}
@media(min-width:640px){.row{grid-template-columns:1fr 1.1fr;gap:16px}}
.chat{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.msg{max-width:84%;background:var(--bubble);padding:9px 13px;border-radius:16px 16px 16px 4px;font-size:16px;line-height:1.5}
.msg small{display:block;font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:2px}
.msg.r{align-self:flex-end;background:var(--gold);color:var(--gold-ink);border-radius:16px 16px 4px 16px}
.msg.r small{color:inherit;opacity:.7}
ol.q{padding-left:22px;margin:18px 0 0}ol.q li{margin:8px 0}
.note{font-size:14px;color:var(--mute);margin-top:14px}
.task{border:1px solid var(--gold);border-radius:10px;padding:18px 20px;background:var(--panel)}
.task blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--gold);background:var(--bubble);font-style:italic}
.task ul{margin:8px 0 0;padding-left:20px}
.btn{display:inline-block;margin-top:18px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:12px 20px;font:500 16px var(--sans);cursor:pointer}
.nav{display:flex;justify-content:space-between;margin-top:20px;font-size:15px}
.err{margin:60px 0;padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--mute)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* Нэг template, өдөр бүр days/day-NN.json-оос ачаалагдана (жишээ нь main.html?day=5).
   "steps" заавал биш: байвал checklist гарч, section-ий дарааллыг тодорхойлно.
   Байхгүй бол байгаа section-үүд (listen, phrases, contrast, read, task) энэ дарааллаар гарна. */
const ORDER = ["listen", "phrases", "contrast", "read", "task"];
const LABELS = {listen: "Сонсох", phrases: "Хэллэг", contrast: "Ялгаа", read: "Унших", task: "Бичих"};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs = a => `<ol class="q">${(a || []).map(q => `<li>${esc(q)}</li>`).join("")}</ol>`;
const dayNumber = () => parseInt(new URLSearchParams(location.search).get("day"), 10) || 1;

async function load(n){
  const r = await fetch(`days/day-${String(n).padStart(2, "0")}.json`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

const SECTIONS = {
  listen: (d, label) => {
    const L = d.listen, v = d.video;
    const video = v ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(v)}" allowfullscreen title="Сонсох бичлэг"></iframe>` : "Бичлэг удахгүй нэмэгдэнэ";
    const tr = (L.transcript || []).map(l => `<p style="margin:6px 0"><b>${esc(l[0])}:</b> ${esc(l[1])}</p>`).join("");
    return `<section id="listen"><h2>${esc(label)}</h2><p class="lead">${esc(L.lead)}</p>
      <div class="video">${video}</div>${qs(L.questions)}
      ${tr ? `<details><summary>Хариулсны дараа бичвэрийг харах</summary><div class="in">${tr}</div></details>` : ""}</section>`;
  },
  phrases: (d, label) => `<section id="phrases"><h2>${esc(label)}</h2><p class="lead">Өнөөдөр цээжлэх хэллэгүүд. Чанга дуугаар хэд хэд давт.</p>
      <div class="cards">${d.phrases.map(p => `<div class="ex"><p class="en">${esc(p[0])}</p><p class="mn">${esc(p[1])}</p><p class="use">${esc(p[2])}</p></div>`).join("")}</div></section>`,
  contrast: (d, label) => `<section id="contrast"><h2>${esc(label)}</h2><p class="lead">Төстэй хэллэгүүдийг хэзээ ялгаж хэрэглэх вэ.</p>
      ${d.contrast.map(c => `<div class="pair"><h3>${esc(c[0])}</h3>${c[1].map(r => `<div class="row"><span>${esc(r[0])}</span><q>${esc(r[1])}</q></div>`).join("")}</div>`).join("")}</section>`,
  read: (d, label) => {
    const R = d.read;
    const speakers = [...new Set((R.chat || []).map(m => m[0]))];
    const me = R.me || speakers[1];   // баруун талд, алтан өнгөөр гарах хүн
    return `<section id="read"><h2>${esc(label)}</h2><p class="lead">${esc(R.lead)}</p>
      <div class="chat">${(R.chat || []).map(m => `<div class="msg ${m[0] === me ? "r" : ""}"><small>${esc(m[0])} · ${esc(m[1])}</small>${esc(m[2])}</div>`).join("")}</div>${qs(R.questions)}
      <p class="note">${esc(R.note || "Дээрх хоёр хэсгийн хариултыг Discord дээр бичихгүй. Хариултын түлхүүр /submit хийсний дараа гарна.")}</p></section>`;
  },
  task: (d, label) => {
    const T = d.task;
    return `<section id="task"><h2>${esc(T.title || label)}</h2>
      <div class="task"><p style="margin:0">${esc(T.lead)}</p><blockquote>${esc(T.message)}</blockquote>
        <p style="margin:0 0 4px">${esc(T.problemsLabel || "Танд дараах асуудлууд байна:")}</p><ul>${(T.problems || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        <p style="margin:14px 0 4px">${esc(T.rulesLabel || "Хариугаа бичихдээ:")}</p><ul>${(T.rules || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        <button class="btn" id="cp">Discord дээр /submit бичих</button>
        <p class="note" id="cpn">Товч дарахад /submit командыг хуулна. Discord руу очоод буулгана.</p></div></section>`;
  }
};

function render(d, n){
  const total = d.total || 28;
  const hasSteps = Array.isArray(d.steps) && d.steps.length > 0;
  const ids = hasSteps ? d.steps.map(s => s[0]) : ORDER.filter(k => d[k]);
  const label = id => (hasSteps && (d.steps.find(s => s[0] === id) || [])[1]) || LABELS[id] || id;

  document.title = `Өдөр ${n} — ${d.title || ""}`;
  const strip = Array.from({length: total}, (_, i) => `<a href="?day=${i + 1}" aria-label="Өдөр ${i + 1}" class="${i + 1 < n ? "done" : i + 1 === n ? "now" : ""}"></a>`).join("");
  const checklist = hasSteps
    ? `<ul class="steps" aria-label="Өнөөдрийн алхмууд">${d.steps.map(s => `<li data-s="${esc(s[0])}"><input type="checkbox" aria-label="${esc(s[1])}"><a href="#${esc(s[0])}">${esc(s[1])}</a>${s[2] ? `<span>${esc(s[2])} мин</span>` : ""}</li>`).join("")}</ul>`
    : "";
  const body = ids.map(id => {
    try { return SECTIONS[id] && d[id] ? SECTIONS[id](d, label(id)) : ""; }
    catch (e) { console.error(`Section "${id}" алдаатай:`, e); return `<section><p class="note">"${esc(id)}" хэсгийг харуулж чадсангүй (JSON-оо шалгана уу).</p></section>`; }
  }).join("");

  $("#app").innerHTML = `
    <div class="top"><b>AnthonyTheSabakumono</b><span>${total} өдрийн хөтөлбөр</span></div>
    <nav class="strip" aria-label="Өдрүүд">${strip}</nav>
    <header>
      <h1>${esc(d.title)}</h1>
      <p class="sub">Өдөр ${n}/${total}${d.minutes ? ` · ойролцоогоор ${esc(d.minutes)} мин` : ""}</p>
      ${d.context ? `<p class="ctx">${esc(d.context)}</p>` : ""}
    </header>
    ${checklist}${body}
    <div class="nav">${n > 1 ? `<a href="?day=${n - 1}">← Өдөр ${n - 1}</a>` : "<span></span>"}${n < total ? `<a href="?day=${n + 1}">Өдөр ${n + 1} →</a>` : "<span></span>"}</div>`;

  if (hasSteps) {   // тэмдэглэсэн алхмуудыг зөвхөн энэ хөтөч дээр санана
    const key = `day${n}`; let saved = {};
    try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
    d.steps.forEach(s => {
      const li = document.querySelector(`li[data-s="${s[0]}"]`); if (!li) return;
      const cb = li.querySelector("input"); cb.checked = !!saved[s[0]]; li.classList.toggle("ok", cb.checked);
      cb.addEventListener("change", () => { li.classList.toggle("ok", cb.checked); saved[s[0]] = cb.checked; try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {} });
    });
  }
  const cp = $("#cp");
  if (cp) cp.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText("/submit"); $("#cpn").textContent = "Хуулагдлаа. Discord дээр буулгана уу."; }
    catch (e) { $("#cpn").textContent = "Discord дээр /submit гэж бичнэ."; }
  });
}

const n = dayNumber();
load(n).then(d => render(d, n)).catch(e => {
  console.error("Өдрийн өгөгдөл ачаалж чадсангүй:", e);
  $("#app").innerHTML = `<div class="err">Өдөр ${n}-ийн хуудсыг ачаалж чадсангүй. Хэсэг хүлээгээд дахин оролдоно уу.<br><small>days/day-${String(n).padStart(2, "0")}.json нээгдэхгүй байна эсвэл JSON-д алдаа байна.</small></div>`;
});
</script>
</body>
</html>
